name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps
          npm install -D @capacitor/cli@latest @capacitor/core@latest @capacitor/ios@latest --legacy-peer-deps

      - name: Build Web App
        run: npm run build

      - name: Initialize Capacitor Configuration
        run: |
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "hu.neptun.orarend",
            "appName": "Neptun Orarend",
            "webDir": "dist"
          }
          EOF

      - name: Setup iOS Platform
        run: |
          npx cap add ios || true
          # Minimum iOS deployment target beállítása iOS 14.0-ra CocoaPods-hoz
          sed -i '' "s/platform :ios, '.*'/platform :ios, '14.0'/g" ios/App/Podfile
          npx cap sync ios

      - name: Build Xcode Archive
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath App.xcarchive archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Package Payload to .ipa
        run: |
          mkdir -p build/Payload
          cp -r ios/App/App.xcarchive/Products/Applications/App.app build/Payload/
          cd build && zip -r NeptunOrarend.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeptunOrarend-ipa
          path: build/NeptunOrarend.ipa
