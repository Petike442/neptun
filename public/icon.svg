<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" stroke="url(#brand)" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Calendar Container -->
  <rect x="96" y="128" width="320" height="288" rx="36" fill="#091e1d" stroke="url(#brand)" stroke-width="8"/>
  
  <!-- Calendar Header Bar -->
  <path d="M96 164 C96 144 112 128 132 128 L380 128 C400 128 416 144 416 164 L416 208 L96 208 Z" fill="url(#brand)"/>

  <!-- Rings / Binder hooks -->
  <rect x="168" y="96" width="24" height="64" rx="12" fill="#e2e8f0"/>
  <rect x="320" y="96" width="24" height="64" rx="12" fill="#e2e8f0"/>

  <!-- Calendar Grid Items / Checkmarks -->
  <circle cx="160" cy="268" r="16" fill="#34d399"/>
  <circle cx="256" cy="268" r="16" fill="#10b981"/>
  <circle cx="352" cy="268" r="16" fill="#059669"/>

  <rect x="144" y="324" width="32" height="12" rx="6" fill="#6ee7b7" fill-opacity="0.8"/>
  <rect x="240" y="324" width="32" height="12" rx="6" fill="#6ee7b7" fill-opacity="0.8"/>
  <rect x="336" y="324" width="32" height="12" rx="6" fill="#6ee7b7" fill-opacity="0.8"/>

  <circle cx="256" cy="372" r="18" fill="url(#accent)"/>
